<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Safari's own "Open in the App Store" banner (Smart App Banner). -->
    <meta name="apple-itunes-app" content="app-id=6809217490" />
    <meta name="theme-color" content="#0B0D11" />
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strivis" />
    <meta property="og:image" content="https://strivis.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Strivis: Train. Track. Progress. The workout logging screen on an iPhone." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://strivis.app/og-image.png" />
    <!-- page-head:start
         Per page and language. This block is the English home page's, for
         `npm run dev`; the build replaces it in every prerendered page with
         that page's own (scripts/prerender.mjs, from src/lib/seo.js): title,
         description, canonical, og/twitter texts, hreflang alternates and
         the structured data (MobileApplication, FAQPage) as JSON-LD. -->
    <title>Strivis: Workout Tracker, Training Plans & Macros for iPhone</title>
    <meta name="description" content="Training plans, workout logging with PR detection, calories and macros, and 601 exercises that work offline. One iPhone app, free to start." />
    <link rel="canonical" href="https://strivis.app/" />
    <meta property="og:url" content="https://strivis.app/" />
    <meta property="og:title" content="Strivis. Train. Track. Progress." />
    <meta property="og:description" content="One iPhone app for training, nutrition and progress. Free to start." />
    <meta name="twitter:title" content="Strivis. Train. Track. Progress." />
    <meta name="twitter:description" content="One iPhone app for training, nutrition and progress. Free to start." />
    <!-- page-head:end -->
    <!-- Fonts are self-hosted (@fontsource, imported in src/main.jsx; the
         Anton file every first screen needs is preloaded by vite.config.js)
         and the Meta Pixel only loads after cookie consent
         (src/lib/consent.js), so nothing here contacts a third party before
         the visitor agrees. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
